<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sour+Gummy:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border with Background</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="qcontainer">
        <div class="container">
            <h1 id="Bigtext">TOrpeDO-Bot</h1>
            <h3 id="Midtext">Write down things you need to get done and
                this bot will make a to-do list for you!</h3>
            <img src="img3000.png" alt="Top Left Image" class="top-left-img">
            <div class="bottom-box">
                <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off"
                    class="form-control type_msg" required />
            </div>
        </div>


        <div class="container2">
            <h1 id="ListText">To-Do list!</h1>
        </div>
    </div>
</body>

</html>
